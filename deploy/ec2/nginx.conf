# /etc/nginx/sites-available/applyforme
# sudo ln -s /etc/nginx/sites-available/applyforme /etc/nginx/sites-enabled/
# sudo certbot --nginx -d apply.example.com

server {
    listen 80;
    server_name apply.example.com;

    # Dashboard + API (incl. /api/pipeline/webhook for EventBridge)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Optional: expose worker health only on localhost / VPN — keep 8787 firewalled from the public internet.
}
